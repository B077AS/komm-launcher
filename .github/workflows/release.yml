# Release pipeline for the Komm launcher itself.
#
# The launcher has no version identity outside of this: pom.xml's <version> is
# never bumped in the tracked source, and jars are only ever built transiently
# with the version set from the release tag (mirrors the komm client repo's
# own release workflow). The two jars this uploads are what UpdateManager
# (this repo) downloads on every start to self-update an already-installed
# launcher. Komm's hub has no release awareness at all; the download page
# just links straight to komm's own GitHub release assets (see that repo's
# release.yml), and this repo's own self-update check talks to GitHub
# directly too.
#
# This deliberately does not build an installer or AppImage: the full
# installer/AppImage for fresh installs is built by the komm (client) repo's
# own release workflow, which checks out this repo's latest release tag and
# rebuilds it from source (bundling the client's own fresh jar) rather than
# downloading anything from here. So a launcher release only ever needs to
# produce the two plain jars an already-installed launcher applies to itself:
#   - Windows: the launcher's own code is a discrete jar (app/komm-launcher.jar)
#     inside an otherwise-untouched, writable install directory. UpdateManager
#     can't overwrite it directly (this running process has it locked), so it
#     stages the download and the *client* applies the swap after the launcher
#     process has already exited (see komm's LauncherUpdateService).
#   - Linux: a JVM already running off a path keeps working off its old inode
#     after that path is atomically replaced underneath it (POSIX
#     unlink-while-open). UpdateManager writes the new jar straight to a
#     stable location, and the launcher relaunches into it on its own next
#     start (see Launcher.main's relaunchIfNewerLauncherStaged). If the
#     bundled runtime itself ever needs to change, that still requires
#     manually reinstalling the AppImage from komm's release page.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve version from release tag
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version from tag
        run: mvn -B versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build Windows-native jar
        run: |
          mvn -B clean package -Pwin-natives
          cp target/komm-launcher.jar komm-launcher-windows.jar

      - name: Build Linux-native jar
        run: |
          mvn -B clean package -Plinux-natives
          cp target/komm-launcher.jar komm-launcher-linux.jar

      - name: Attach artifacts to the release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            komm-launcher-windows.jar \
            komm-launcher-linux.jar \
            --clobber -R "$GITHUB_REPOSITORY"
