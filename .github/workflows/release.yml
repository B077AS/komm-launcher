# Release pipeline for the Komm launcher itself.
#
# The launcher has no version identity outside of this: pom.xml's <version> is
# never bumped in the tracked source, and jars are only ever built transiently
# with the version set from the release tag (mirrors the komm client repo's
# own release workflow). What this uploads is what komm-hub's
# LauncherReleaseSyncService polls for and what UpdateManager (this repo)
# downloads on every client start to self-update an already-installed launcher.
#
# Distinct from — and does not replace — the full installer/AppImage build,
# which still happens from the komm (client) repo's own release workflow,
# checking out this repo's latest release tag and bundling that jar alongside
# the client's own runtime/native-elevated packaging (jpackage + Inno Setup /
# appimagetool). The full AppImage built and uploaded here exists only for
# that seeding purpose and for fresh installs — it is not itself downloaded
# to update an already-installed launcher (see below).
#
# Windows and Linux apply a self-update differently, but both now just need a
# plain jar, not a full reinstall's worth of assets:
#   - Windows: the launcher's own code is a discrete jar (app/komm-launcher.jar)
#     inside an otherwise-untouched, writable install directory. UpdateManager
#     can't overwrite it directly (this running process has it locked), so it
#     stages the download and the *client* applies the swap after the launcher
#     process has already exited (see komm's LauncherUpdateService).
#   - Linux: an AppImage is one opaque, read-only-mounted unit, so nothing can
#     write into it in place — but a JVM already running off a path keeps
#     working off its old inode after that path is atomically replaced
#     underneath it (POSIX unlink-while-open). UpdateManager writes the new jar
#     straight to a stable location outside the mount, and the launcher
#     relaunches into it on its own next start (see Launcher.main's
#     relaunchIfNewerLauncherStaged). The full .AppImage only needs to be
#     manually reinstalled again if the bundled runtime itself must change,
#     which should be rare.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve version from release tag
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version from tag
        run: mvn -B versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build Windows-native jar
        run: |
          mvn -B clean package -Pwin-natives
          cp target/komm-launcher.jar komm-launcher-windows.jar

      - name: Build Linux-native jar
        run: |
          mvn -B clean package -Plinux-natives
          cp target/komm-launcher.jar komm-launcher-linux.jar

      - name: Get latest client jar (AppImage seed)
        id: client-jar
        run: |
          gh release download --repo B077AS/komm --pattern "komm-*.jar" --dir client-jar
          echo "client_jar=$(ls client-jar/*.jar | head -1)" >> "$GITHUB_OUTPUT"

      - name: Install appimagetool
        run: |
          mkdir -p ~/.local/bin
          curl -Lo ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ~/.local/bin/appimagetool

      - name: Build Linux AppImage
        run: |
          mvn -B clean package -Pappimage \
            "-Dclient.version=${{ steps.v.outputs.version }}" \
            "-Dclient.jar=${{ steps.client-jar.outputs.client_jar }}"
          cp target/appimage/Komm-*.AppImage komm-launcher-linux.AppImage

      - name: Attach artifacts to the release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            komm-launcher-windows.jar \
            komm-launcher-linux.jar \
            komm-launcher-linux.AppImage \
            --clobber -R "$GITHUB_REPOSITORY"
