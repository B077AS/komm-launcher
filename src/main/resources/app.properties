# Hub base URL — filled in from the pom's hub.url at build time (Maven resource
# filtering): localhost by default, the official hub (https://kommvoice.com)
# with the prod profile (-Pinstaller,prod / -Pappimage,prod). A -Dapi.url=
# runtime override still wins over it for dev runs.
api.url=${hub.url}
# Self-describing launcher version — same idea as the client's client.version.
# Forwarded to the spawned client as -Dlauncher.version so it can tell whether
# the launcher that started it needs updating.
launcher.version=${project.version}
